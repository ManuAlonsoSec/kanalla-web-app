<main class="admin-login" aria-label="Panel de administración">
  <div class="admin-login__card">
    <div class="admin-login__header">
      <span class="material-symbols-outlined admin-login__icon" aria-hidden="true">lock</span>
      <h1 class="admin-login__title">Acceso Administración</h1>
      <p class="admin-login__subtitle">Kanalla Sky Bar</p>
    </div>

    @if (errorMessage()) {
      <div class="admin-login__error" role="alert">
        <span class="material-symbols-outlined" aria-hidden="true">error</span>
        {{ errorMessage() }}
      </div>
    }

    <form class="admin-login__form" [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>

      <div class="field">
        <label class="field__label" for="email">Email</label>
        <input
          id="email"
          class="field__input"
          type="email"
          formControlName="email"
          placeholder="admin@kanalla.es"
          autocomplete="username"
          [class.field__input--error]="form.controls.email.invalid && form.controls.email.touched"
        />
      </div>

      <div class="field">
        <label class="field__label" for="password">Contraseña</label>
        <div class="field__password-wrapper">
          <input
            id="password"
            class="field__input"
            [type]="showPassword() ? 'text' : 'password'"
            formControlName="password"
            placeholder="••••••••"
            autocomplete="current-password"
            [class.field__input--error]="form.controls.password.invalid && form.controls.password.touched"
          />
          <button
            type="button"
            class="field__password-toggle"
            (click)="togglePassword()"
            [attr.aria-label]="showPassword() ? 'Ocultar contraseña' : 'Mostrar contraseña'"
          >
            <span class="material-symbols-outlined" aria-hidden="true">
              {{ showPassword() ? 'visibility_off' : 'visibility' }}
            </span>
          </button>
        </div>
      </div>

      <button
        class="btn btn-primary admin-login__submit"
        type="submit"
        [disabled]="loading()"
      >
        @if (loading()) {
          <span class="material-symbols-outlined admin-login__spinner" aria-hidden="true">progress_activity</span>
          Accediendo...
        } @else {
          <span class="material-symbols-outlined" aria-hidden="true">login</span>
          Iniciar Sesión
        }
      </button>

    </form>
  </div>
</main>
